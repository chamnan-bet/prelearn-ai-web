# Nginx server block for prelearn-ai-web (Vue SPA, history-mode router).
# Copy to /etc/nginx/sites-available/prelearn, symlink into sites-enabled, then reload nginx.
# Replace YOUR_DOMAIN and the root path before use.

server {
    listen 80;
    listen [::]:80;
    server_name chamnan.online www.chamnan.online;

    root /var/www/prelearn-ai-web/dist;
    index index.html;

    # SPA fallback — vue-router uses createWebHistory, so any unmatched
    # path must resolve to index.html and let the client-side router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache immutable, content-hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
